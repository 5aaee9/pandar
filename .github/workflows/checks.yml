name: Checks

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend tests and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tagged release versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint Web
        run: npm run lint:web

      - name: Run Web tests
        run: npm run test:web

      - name: Run Auth tests
        run: npm run test:auth

      - name: Type-check Web
        run: npm run typecheck:web

      - name: Type-check Auth
        run: npm run typecheck:auth

  rust-security:
    name: Rust security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Audit Rust dependencies
        run: cargo install cargo-audit --locked && cargo audit

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint docs/deployment/kubernetes --set hub.accessCodeEncryption.existingSecret=pandar-hub-secrets

      - name: Verify deployment security defaults
        run: scripts/check-deployment-security.sh

  nix-quality-checks:
    name: Nix quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: pandar_test
          POSTGRES_PASSWORD: pandar_test
          POSTGRES_USER: pandar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandar_test -d pandar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Verify generated Hub migrations
        run: scripts/sync-hub-migrations.sh --check

      - name: Run checks
        run: |
          nix build --show-trace \
            .#checks.x86_64-linux.pandar-fmt \
            .#checks.x86_64-linux.pandar-clippy \
            .#checks.x86_64-linux.pandar-nextest \
            .#checks.x86_64-linux.pandar-nixos-module \
            .#checks.x86_64-linux.pandar-nixos-options-doc

      - name: Run PostgreSQL parity tests
        env:
          PANDAR_REQUIRE_POSTGRES_TESTS: "true"
          PANDAR_TEST_POSTGRES_URL: "postgresql://pandar_test:pandar_test@127.0.0.1:5432/pandar_test"
        run: >-
          nix develop --command cargo nextest run
          -p pandar-hub
          -E 'test(/postgres/)'
          --no-tests=fail

  nix-package-checks:
    name: Nix package checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Build packages
        run: |
          packages=(
            .#checks.${{ matrix.system }}.pandar-hub \
            .#checks.${{ matrix.system }}.pandar-agent \
            .#checks.${{ matrix.system }}.pandar-cli \
            .#checks.${{ matrix.system }}.pandar-auth \
            .#checks.${{ matrix.system }}.pandar-web
          )
          if [ "${{ matrix.system }}" = "x86_64-linux" ]; then
            packages+=(.#checks.${{ matrix.system }}.pandar-network-plugin)
          fi
          nix build --show-trace "${packages[@]}"

  nixos-vm-tests:
    name: NixOS VM test (${{ matrix.backend }}, ${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            system: x86_64-linux
            runner: ubuntu-latest
          - backend: postgres
            system: x86_64-linux
            runner: ubuntu-latest
          - backend: sqlite
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - backend: postgres
            system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up hestia cache
        uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
        with:
          version: v3.0.0
          upstream-cache-filter: true
          no-closure: true

      - name: Run NixOS VM test
        run: nix build --show-trace .#checks.${{ matrix.system }}.pandar-nixos-test-${{ matrix.backend }}
