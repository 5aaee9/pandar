name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Verify Checks for image SHA
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for successful Checks workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const deadline = Date.now() + 120 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "checks.yml",
                event: "push",
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs
                .filter(candidate => candidate.head_sha === context.sha)
                .sort((left, right) => right.run_number - left.run_number)[0];
              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`Checks run ${run.html_url} concluded ${run.conclusion}`);
                } else {
                  core.info(`Checks passed for ${context.sha}: ${run.html_url}`);
                }
                return;
              }
              core.info(run
                ? `Checks run ${run.html_url} is ${run.status}`
                : `Waiting for a Checks run for ${context.sha}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            core.setFailed(`Timed out waiting for Checks on ${context.sha}`);

  docker:
    name: Build and publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - quality-gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: hub
            context: .
            dockerfile: Dockerfile
          - name: web
            context: .
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/projectpandar/pandar/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Cleanup untagged image
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: pandar/${{ matrix.image.name }}
          delete-untagged: true

  helm-chart:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    needs:
      - docker
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve chart version
        id: chart-version
        shell: bash
        run: |
          set -euo pipefail
          chart_dir="docs/deployment/kubernetes"
          base_version="$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' "$chart_dir/Chart.yaml" | head -n1 | tr -d "\"'[:space:]")"
          if [ -z "$base_version" ]; then
            base_version="0.1.4"
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            chart_version="${GITHUB_REF_NAME#v}"
            app_version="${GITHUB_REF_NAME}"
            prerelease="false"
          else
            chart_version="${base_version}-main"
            app_version="main"
            prerelease="true"
          fi

          {
            echo "version=$chart_version"
            echo "app-version=$app_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint docs/deployment/kubernetes --set hub.accessCodeEncryption.existingSecret=pandar-hub-secrets

      - name: Verify deployment security defaults
        run: scripts/check-deployment-security.sh

      - name: Package chart
        run: |
          mkdir -p dist/chart
          helm package docs/deployment/kubernetes \
            --destination dist/chart \
            --version "${{ steps.chart-version.outputs.version }}" \
            --app-version "${{ steps.chart-version.outputs.app-version }}"

      - name: Remove replaceable main chart tag
        if: steps.chart-version.outputs.prerelease == 'true'
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: pandar/chart/pandar
          delete-tags: ${{ steps.chart-version.outputs.version }}

      - name: Log in to GHCR for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: helm push "dist/chart/pandar-${{ steps.chart-version.outputs.version }}.tgz" oci://ghcr.io/projectpandar/pandar/chart
