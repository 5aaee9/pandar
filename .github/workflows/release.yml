name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  STUDIO_COMMIT: ba049f6a2e08c3b6033660bb84da80c08722974b
  BOOST_URL: https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost-1.84.0.tar.gz
  BOOST_SHA256: 4d27e9efed0f6f152dc28db6430b9d3dfb40c0345da7342eaa5a987dde57bd95

jobs:
  linux-amd64:
    name: Build native Linux amd64 release archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned Bambu Studio contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: bambulab/BambuStudio
          ref: ${{ env.STUDIO_COMMIT }}
          path: .release/BambuStudio
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Download pinned Boost source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          curl --fail --location --retry 3 --output .release/boost-1.84.0.tar.gz "$BOOST_URL"
          echo "$BOOST_SHA256  .release/boost-1.84.0.tar.gz" | sha256sum --check --strict

      - name: Build native release artifacts and ABI probe
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release -p pandar-app --bin pandar --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/zig-cc"
          printf '%s\n' '#!/usr/bin/env bash' 'exec zig cc -target x86_64-linux-gnu "$@"' > "$RUNNER_TEMP/zig-cc/zig-cc-plugin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec zig c++ -target x86_64-linux-gnu "$@"' > "$RUNNER_TEMP/zig-cc/zig-cxx-plugin"
          chmod +x "$RUNNER_TEMP/zig-cc/zig-cc-plugin" "$RUNNER_TEMP/zig-cc/zig-cxx-plugin"
          CC="$RUNNER_TEMP/zig-cc/zig-cc-plugin" \
            CXX="$RUNNER_TEMP/zig-cc/zig-cxx-plugin" \
            AR="zig ar" \
            cargo zigbuild --release -p pandar-network-plugin -p pandar-bambu-source \
              --target x86_64-unknown-linux-gnu
          cargo build --release --manifest-path tools/studio-abi-contract/Cargo.toml

      - name: Package exact three-file archive
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="pandar-release-${safe_ref}-linux-amd64.tar.gz"
          stage="$RUNNER_TEMP/pandar-release-linux-amd64"
          mkdir -p "$stage" dist
          cp target/x86_64-unknown-linux-musl/release/pandar "$stage/pandar"
          cp target/x86_64-unknown-linux-gnu/release/libpandar_network_plugin.so "$stage/libpandar_network_plugin.so"
          cp target/x86_64-unknown-linux-gnu/release/libpandar_bambu_source.so "$stage/libpandar_bambu_source.so"
          tar -C "$stage" -czf "dist/$archive" \
            pandar libpandar_network_plugin.so libpandar_bambu_source.so
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Smoke packaged archive on its native host
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="dist/pandar-release-${safe_ref}-linux-amd64.tar.gz"
          cargo run --manifest-path tools/release-smoke/Cargo.toml -- \
            --label linux-amd64 \
            --archive "$archive" \
            --checksum "$archive.sha256" \
            --cli-name pandar \
            --plugin-name libpandar_network_plugin.so \
            --source-name libpandar_bambu_source.so \
            --repo-root "$GITHUB_WORKSPACE" \
            --abi-probe tools/studio-abi-contract/target/release/pandar-studio-abi-contract \
            --abi-probe-arg --studio-source \
            --abi-probe-arg "$GITHUB_WORKSPACE/.release/BambuStudio" \
            --abi-probe-arg --boost-archive \
            --abi-probe-arg "$GITHUB_WORKSPACE/.release/boost-1.84.0.tar.gz"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-linux-amd64
          path: dist/*
          if-no-files-found: error

  windows-amd64:
    name: Build native Windows amd64 release archives
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Pandar
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned Bambu Studio contract source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: bambulab/BambuStudio
          ref: ${{ env.STUDIO_COMMIT }}
          path: .release/BambuStudio
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Download pinned Boost source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .release | Out-Null
          $archive = Join-Path $env:GITHUB_WORKSPACE ".release/boost-1.84.0.tar.gz"
          Invoke-WebRequest -Uri $env:BOOST_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:BOOST_SHA256) {
            throw "Boost checksum mismatch: expected $env:BOOST_SHA256, got $actual"
          }

      - name: Build native release artifacts and ABI probe
        shell: pwsh
        run: |
          cargo build --release -p pandar-app -p pandar-network-plugin -p pandar-bambu-source -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --manifest-path tools/studio-abi-contract/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release archive and Studio hook bundle
        shell: pwsh
        run: |
          $safeRef = ($env:GITHUB_REF_NAME ?? "manual").Replace("/", "-")
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $releaseStage = Join-Path $env:RUNNER_TEMP "pandar-release-windows-amd64"
          $hookStage = Join-Path $env:RUNNER_TEMP "pandar-studio-hook-windows-amd64"
          New-Item -ItemType Directory -Force -Path $dist, $releaseStage, $hookStage | Out-Null

          $target = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release"
          Copy-Item (Join-Path $target "pandar.exe") (Join-Path $releaseStage "pandar.exe")
          Copy-Item (Join-Path $target "pandar_network_plugin.dll") (Join-Path $releaseStage "pandar_network_plugin.dll")
          Copy-Item (Join-Path $target "pandar_bambu_source.dll") (Join-Path $releaseStage "pandar_bambu_source.dll")
          $releaseArchive = Join-Path $dist "pandar-release-$safeRef-windows-amd64.tar.gz"
          tar -C $releaseStage -czf $releaseArchive pandar.exe pandar_network_plugin.dll pandar_bambu_source.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseHash = (Get-FileHash -Algorithm SHA256 $releaseArchive).Hash.ToLowerInvariant()
          "$releaseHash  $(Split-Path -Leaf $releaseArchive)" | Set-Content -NoNewline "$releaseArchive.sha256"

          Copy-Item (Join-Path $target "pandar_studio_hook.dll") (Join-Path $hookStage "pandar_studio_hook.dll")
          Copy-Item (Join-Path $target "pandar_network_plugin.dll") (Join-Path $hookStage "pandar_network_plugin.dll")
          Copy-Item (Join-Path $target "pandar_bambu_source.dll") (Join-Path $hookStage "pandar_bambu_source.dll")
          $hookArchive = Join-Path $dist "pandar-studio-hook-02.08.01-windows-amd64.zip"
          Compress-Archive -Path (Join-Path $hookStage "*") -DestinationPath $hookArchive -CompressionLevel Optimal
          $hookHash = (Get-FileHash -Algorithm SHA256 $hookArchive).Hash.ToLowerInvariant()
          "$hookHash  $(Split-Path -Leaf $hookArchive)" | Set-Content -NoNewline "$hookArchive.sha256"

      - name: Smoke packaged archive on its native host
        shell: pwsh
        run: |
          $safeRef = ($env:GITHUB_REF_NAME ?? "manual").Replace("/", "-")
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/pandar-release-$safeRef-windows-amd64.tar.gz"
          cargo run --manifest-path tools/release-smoke/Cargo.toml -- `
            --label windows-amd64 `
            --archive $archive `
            --checksum "$archive.sha256" `
            --cli-name pandar.exe `
            --plugin-name pandar_network_plugin.dll `
            --source-name pandar_bambu_source.dll `
            --repo-root $env:GITHUB_WORKSPACE `
            --abi-probe tools/studio-abi-contract/target/release/pandar-studio-abi-contract.exe `
            --abi-probe-arg --studio-source `
            --abi-probe-arg "$env:GITHUB_WORKSPACE/.release/BambuStudio" `
            --abi-probe-arg --boost-archive `
            --abi-probe-arg "$env:GITHUB_WORKSPACE/.release/boost-1.84.0.tar.gz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-windows-amd64
          path: dist/*
          if-no-files-found: error

  quality-gate:
    name: Verify Checks for release SHA
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for successful Checks workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const deadline = Date.now() + 120 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "checks.yml",
                event: "push",
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs
                .filter(candidate => candidate.head_sha === context.sha)
                .sort((left, right) => right.run_number - left.run_number)[0];
              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`Checks run ${run.html_url} concluded ${run.conclusion}`);
                } else {
                  core.info(`Checks passed for ${context.sha}: ${run.html_url}`);
                }
                return;
              }
              core.info(run
                ? `Checks run ${run.html_url} is ${run.status}`
                : `Waiting for a Checks run for ${context.sha}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            core.setFailed(`Timed out waiting for Checks on ${context.sha}`);

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-amd64
      - windows-amd64
      - quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: pandar-release-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
