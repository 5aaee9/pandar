name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            cli-target: x86_64-unknown-linux-musl
            plugin-target: x86_64-unknown-linux-gnu
            zig-plugin-target: x86_64-linux-gnu
            cli-name: pandar
            plugin-name: libpandar_network_plugin.so
            use-zig-cc: true
            windows-crt-static: false
          - label: linux-arm64
            runner: ubuntu-latest
            cli-target: aarch64-unknown-linux-musl
            plugin-target: aarch64-unknown-linux-gnu
            zig-plugin-target: aarch64-linux-gnu
            cli-name: pandar
            plugin-name: libpandar_network_plugin.so
            use-zig-cc: true
            windows-crt-static: false
          - label: windows-amd64
            runner: ubuntu-latest
            cli-target: x86_64-pc-windows-gnu
            plugin-target: x86_64-pc-windows-gnu
            zig-plugin-target: x86_64-windows-gnu
            cli-name: pandar.exe
            plugin-name: pandar_network_plugin.dll
            use-zig-cc: true
            windows-crt-static: true
          - label: windows-arm64
            runner: ubuntu-latest
            cli-target: aarch64-pc-windows-gnullvm
            plugin-target: aarch64-pc-windows-gnullvm
            zig-plugin-target: aarch64-windows-gnu
            cli-name: pandar.exe
            plugin-name: pandar_network_plugin.dll
            use-zig-cc: true
            windows-crt-static: true
          - label: macos-amd64
            runner: macos-26-intel
            cli-target: x86_64-apple-darwin
            plugin-target: x86_64-apple-darwin
            zig-plugin-target: ""
            cli-name: pandar
            plugin-name: libpandar_network_plugin.dylib
            use-zig-cc: false
            windows-crt-static: false
          - label: macos-arm64
            runner: macos-26
            cli-target: aarch64-apple-darwin
            plugin-target: aarch64-apple-darwin
            zig-plugin-target: ""
            cli-name: pandar
            plugin-name: libpandar_network_plugin.dylib
            use-zig-cc: false
            windows-crt-static: false

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.cli-target }},${{ matrix.plugin-target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build pandar CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.windows-crt-static }}" = "true" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          if [ "${{ matrix.use-zig-cc }}" = "true" ]; then
            cargo zigbuild --release -p pandar-app --bin pandar --target "${{ matrix.cli-target }}"
          else
            cargo build --release -p pandar-app --bin pandar --target "${{ matrix.cli-target }}"
          fi

      - name: Build pandar network plugin
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use-zig-cc }}" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/zig-cc"
            printf '%s\n' '#!/usr/bin/env bash' "exec zig cc -target \"\$ZIG_PLUGIN_TARGET\" \"\$@\"" > "$RUNNER_TEMP/zig-cc/zig-cc-plugin"
            printf '%s\n' '#!/usr/bin/env bash' "exec zig c++ -target \"\$ZIG_PLUGIN_TARGET\" \"\$@\"" > "$RUNNER_TEMP/zig-cc/zig-cxx-plugin"
            chmod +x "$RUNNER_TEMP/zig-cc/zig-cc-plugin" "$RUNNER_TEMP/zig-cc/zig-cxx-plugin"
            export ZIG_PLUGIN_TARGET="${{ matrix.zig-plugin-target }}"
            export CC="$RUNNER_TEMP/zig-cc/zig-cc-plugin"
            export CXX="$RUNNER_TEMP/zig-cc/zig-cxx-plugin"
            export AR="zig ar"
          fi
          if [ "${{ matrix.use-zig-cc }}" = "true" ]; then
            cargo zigbuild --release -p pandar-network-plugin --target "${{ matrix.plugin-target }}"
          else
            cargo build --release -p pandar-network-plugin --target "${{ matrix.plugin-target }}"
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="pandar-release-${safe_ref}-${{ matrix.label }}.tar.gz"
          stage="$RUNNER_TEMP/pandar-release-${{ matrix.label }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.cli-target }}/release/${{ matrix.cli-name }}" "$stage/${{ matrix.cli-name }}"
          cp "target/${{ matrix.plugin-target }}/release/${{ matrix.plugin-name }}" "$stage/${{ matrix.plugin-name }}"
          tar -C "$stage" -czf "dist/$archive" .
          (
            cd dist
            shasum -a 256 "$archive" | awk '{print $1 "  " $2}' > "$archive.sha256"
          )

      - name: Check Windows PE inspector
        if: startsWith(matrix.label, 'windows-')
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v llvm-objdump >/dev/null 2>&1 || ! command -v llvm-nm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          command -v objdump
          command -v llvm-objdump
          command -v llvm-nm

      - name: Smoke release artifact
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-manual}"
          safe_ref="${ref_name//\//-}"
          archive="dist/pandar-release-${safe_ref}-${{ matrix.label }}.tar.gz"
          checksum="$archive.sha256"
          (
            cd dist
            shasum -a 256 -c "$(basename "$checksum")"
          )
          cargo run --manifest-path tools/release-smoke/Cargo.toml -- \
            --label "${{ matrix.label }}" \
            --runner-os "${{ runner.os == 'macOS' && 'macos' || 'linux' }}" \
            --archive "$archive" \
            --checksum "$checksum" \
            --cli-name "${{ matrix.cli-name }}" \
            --plugin-name "${{ matrix.plugin-name }}" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  studio-hook-windows:
    name: Build native Windows Studio hook bundle
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build native Studio libraries and hook
        shell: pwsh
        run: |
          cargo build --release -p pandar-network-plugin -p pandar-bambu-source -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p pandar-studio-hook --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Studio hook bundle
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "pandar-studio-hook-windows-amd64"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $stage, $dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/pandar_studio_hook.dll" (Join-Path $stage "pandar_studio_hook.dll")
          Copy-Item "target/x86_64-pc-windows-msvc/release/pandar_network_plugin.dll" (Join-Path $stage "pandar_network_plugin.dll")
          Copy-Item "target/x86_64-pc-windows-msvc/release/pandar_bambu_source.dll" (Join-Path $stage "pandar_bambu_source.dll")
          $archive = Join-Path $dist "pandar-studio-hook-02.08.01-windows-amd64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  pandar-studio-hook-02.08.01-windows-amd64.zip" | Set-Content -NoNewline "$archive.sha256"

      - name: Upload Studio hook bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-studio-hook-windows-amd64
          path: dist/*
          if-no-files-found: error

  quality-gate:
    name: Verify Checks for release SHA
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for successful Checks workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const deadline = Date.now() + 120 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "checks.yml",
                event: "push",
                head_sha: context.sha,
                per_page: 100,
              });
              const run = data.workflow_runs
                .filter(candidate => candidate.head_sha === context.sha)
                .sort((left, right) => right.run_number - left.run_number)[0];
              if (run?.status === "completed") {
                if (run.conclusion !== "success") {
                  core.setFailed(`Checks run ${run.html_url} concluded ${run.conclusion}`);
                } else {
                  core.info(`Checks passed for ${context.sha}: ${run.html_url}`);
                }
                return;
              }
              core.info(run
                ? `Checks run ${run.html_url} is ${run.status}`
                : `Waiting for a Checks run for ${context.sha}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
            core.setFailed(`Timed out waiting for Checks on ${context.sha}`);

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - studio-hook-windows
      - quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: pandar-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
