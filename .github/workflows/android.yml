name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/android/**"
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Calculate version code
        id: version
        shell: bash
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.code }}

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pandar-android-${{ steps.version.outputs.code }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
