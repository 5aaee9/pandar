services:
  pandar-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pandar-api
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    environment:
      PANDAR_DATABASE_URL: sqlite:///data/pandar.db
      PANDAR_HUB_BIND: 0.0.0.0:8080
      PANDAR_HUB_GRPC_BIND: 0.0.0.0:50051
      PANDAR_HUB_GRPC_TLS_CERT: /run/pandar-grpc/tls.crt
      PANDAR_HUB_GRPC_TLS_KEY: /run/pandar-grpc/tls.key
      PANDAR_PRINTER_ACCESS_CODE_KEY: ${PANDAR_PRINTER_ACCESS_CODE_KEY:?set PANDAR_PRINTER_ACCESS_CODE_KEY}
      PANDAR_ARTIFACT_STORAGE: filesystem
      PANDAR_SPOOL_DIR: /spool
      PANDAR_EXTERNAL_AUTH_PROVIDER: ${PANDAR_EXTERNAL_AUTH_PROVIDER:-}
      PANDAR_EXTERNAL_AUTH_ISSUER: ${PANDAR_EXTERNAL_AUTH_ISSUER:-}
      PANDAR_EXTERNAL_AUTH_JWKS_URL: ${PANDAR_EXTERNAL_AUTH_JWKS_URL:-}
      PANDAR_EXTERNAL_AUTH_AUDIENCE: ${PANDAR_EXTERNAL_AUTH_AUDIENCE:-}
      PANDAR_EXTERNAL_AUTH_ALGORITHMS: ${PANDAR_EXTERNAL_AUTH_ALGORITHMS:-}
      PANDAR_AUTH_ALLOW_TENANT_SELF_CREATE: ${PANDAR_AUTH_ALLOW_TENANT_SELF_CREATE:-true}
      PANDAR_HUB_CAMERA_MAX_STREAMS_PER_TENANT: ${PANDAR_HUB_CAMERA_MAX_STREAMS_PER_TENANT:-8}
    volumes:
      - pandar-sqlite:/data
      - pandar-spool:/spool
      - ${PANDAR_HUB_GRPC_TLS_CERT_FILE:?set PANDAR_HUB_GRPC_TLS_CERT_FILE}:/run/pandar-grpc/tls.crt:ro
      - ${PANDAR_HUB_GRPC_TLS_KEY_FILE:?set PANDAR_HUB_GRPC_TLS_KEY_FILE}:/run/pandar-grpc/tls.key:ro
    ports:
      - "127.0.0.1:${PANDAR_HTTP_PORT:-8080}:8080"
      - "${PANDAR_GRPC_PORT:-50051}:50051"

  pandar-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: pandar-web
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000
    environment:
      APP_API_URL: http://pandar-api:8080
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      APP_TENANT_ID: ${APP_TENANT_ID:-}
      APP_AUTH_PROVIDER: ${APP_AUTH_PROVIDER:-none}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-pandar_auth_token}
      APP_AUTH_CLERK_PUBLISHABLE_KEY: ${APP_AUTH_CLERK_PUBLISHABLE_KEY:-}
      APP_AUTH_LOGTO_ENDPOINT: ${APP_AUTH_LOGTO_ENDPOINT:-}
      APP_AUTH_LOGTO_APP_ID: ${APP_AUTH_LOGTO_APP_ID:-}
      APP_AUTH_BETTER_AUTH_BASE_URL: ${APP_AUTH_BETTER_AUTH_BASE_URL:-}
      PORT: 3000
    ports:
      - "127.0.0.1:${PANDAR_WEB_PORT:-3000}:3000"
    depends_on:
      - pandar-api

volumes:
  pandar-sqlite:
  pandar-spool:
