apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pandar.fullname" . }}-hub
  labels:
    {{- include "pandar.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ .Values.hub.replicaCount }}
  selector:
    matchLabels:
      {{- include "pandar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      labels:
        {{- include "pandar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
        {{- with .Values.hub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hub.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      serviceAccountName: {{ include "pandar.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          {{- with .Values.hub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.hub.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.hub.service.grpcPort }}
              protocol: TCP
            - name: observability
              containerPort: {{ .Values.hub.service.observabilityPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "pandar.fullname" . }}-hub
          env:
            - name: PANDAR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "pandar.hubDatabaseSecretName" . }}
                  key: {{ .Values.hub.database.existingSecretKey }}
            - name: PANDAR_PRINTER_ACCESS_CODE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "hub.accessCodeEncryption.existingSecret is required" .Values.hub.accessCodeEncryption.existingSecret }}
                  key: {{ .Values.hub.accessCodeEncryption.existingSecretKey }}
            {{- with .Values.hub.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: observability
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.hub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: grpc-tls
              mountPath: /grpc-tls
              readOnly: true
            {{- if .Values.hub.persistence.data.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.hub.persistence.spool.enabled }}
            - name: spool
              mountPath: /spool
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: grpc-tls
          secret:
            secretName: {{ required "hub.grpcTls.existingSecret is required" .Values.hub.grpcTls.existingSecret }}
            items:
              - key: {{ .Values.hub.grpcTls.certificateKey }}
                path: tls.crt
              - key: {{ .Values.hub.grpcTls.privateKeyKey }}
                path: tls.key
        {{- if .Values.hub.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-hub-data" (include "pandar.fullname" .)) .Values.hub.persistence.data.existingClaim }}
        {{- end }}
        {{- if .Values.hub.persistence.spool.enabled }}
        - name: spool
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-hub-spool" (include "pandar.fullname" .)) .Values.hub.persistence.spool.existingClaim }}
        {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
