syntax = "proto3";

package pandar.agent.v1;

import "pandar/agent/v1/firmware.proto";
import "pandar/agent/v1/print_project.proto";

service AgentControl {
  rpc ReverseConnect(stream AgentEvent) returns (stream HubCommand);
  rpc ReverseCamera(stream AgentCameraEvent) returns (stream HubCameraCommand);
}

message AgentEvent {
  string agent_id = 1;
  string tenant_id = 2;
  string event_id = 3;
  oneof event {
    AgentHello hello = 10;
    AgentHeartbeat heartbeat = 11;
    PrinterSnapshot printer_snapshot = 12;
    CommandAck command_ack = 13;
    CommandResult command_result = 14;
    PrintJobReport print_job_report = 15;
    PrinterMaterialsSnapshot printer_materials_snapshot = 16;
    PrinterDeviceFeaturesSnapshot printer_device_features_snapshot = 17;
    PrinterFirmwareModulesSnapshot printer_firmware_modules_snapshot = 18;
    PrinterFirmwareStatusSnapshot printer_firmware_status_snapshot = 19;
    PrinterFirmwareInvalidated printer_firmware_invalidated = 20;
    FirmwarePrepared firmware_prepared = 21;
    FirmwarePublished firmware_published = 22;
  }
}

enum AgentCapability {
  AGENT_CAPABILITY_UNSPECIFIED = 0;
  AGENT_CAPABILITY_HANDLE_PRINT_ERROR = 1;
  AGENT_CAPABILITY_HANDLE_PRINT_ERROR_SEQUENCE_ZERO_PUBACK_ONLY = 2;
  AGENT_CAPABILITY_REQUIRED_DEVICE_FEATURES = 3;
  AGENT_CAPABILITY_GCODE_LINE = 4;
  AGENT_CAPABILITY_FIRMWARE_CONTROL = 5;
  AGENT_CAPABILITY_H2C_AUTO_NOZZLE_MAPPING = 6;
  AGENT_CAPABILITY_STUDIO_LOCAL_CAMERA = 7;
}

message AgentHello {
  string name = 1;
  string version = 2;
  string credential = 3;
  repeated AgentCapability capabilities = 4;
}

message AgentHeartbeat {
  string observed_at = 1;
}

message PrinterSnapshot {
  string serial = 1;
  string name = 2;
  string state = 3;
  string model = 4;
  repeated NozzleTemperature nozzle_temperatures = 5;
  string bed_temperature_celsius = 6;
  string bed_target_temperature_celsius = 7;
  string chamber_temperature_celsius = 8;
  string active_nozzle = 9;
  optional bool chamber_light_on = 10;
  string host = 11;
  string access_code = 12;
  PrinterDeviceFeatures device_features = 13;
  bool connection_authoritative = 14;
  string chamber_target_temperature_celsius = 15;
  bool telemetry_authoritative = 16;
  PrinterNozzleSystem nozzle_system = 17;
}

message PrinterNozzleSystem {
  PrinterNozzleDevice nozzle = 1;
  PrinterNozzleHolder holder = 2;
}

message PrinterNozzleDevice {
  optional uint32 exist = 1;
  optional uint32 state = 2;
  optional sint32 src_id = 3;
  optional sint32 tar_id = 4;
  repeated PrinterNozzleInfo info = 5;
}

message PrinterNozzleInfo {
  sint32 id = 1;
  float diameter = 2;
  string nozzle_type = 3;
  optional uint32 stat = 4;
  optional string fila_id = 5;
  optional float wear = 6;
  optional sint32 print_time = 7;
  optional string color = 8;
}

message PrinterNozzleHolder {
  optional sint32 stat = 1;
  optional sint32 pos = 2;
  optional sint32 info = 3;
}

message PrinterDeviceFeatures {
  optional fixed64 bambu_fun_bits = 1;
  optional fixed64 bambu_fun2_bits = 2;
}

message PrinterDeviceFeaturesSnapshot {
  string serial = 1;
  PrinterDeviceFeatures device_features = 2;
}

enum DeviceFeature {
  DEVICE_FEATURE_UNSPECIFIED = 0;
  DEVICE_FEATURE_BAMBU_MQTT_HOMING = 32;
  DEVICE_FEATURE_BAMBU_MQTT_AXIS_CONTROL = 38;
}

message NozzleTemperature {
  string label = 1;
  string current_celsius = 2;
  string target_celsius = 3;
  string diameter_mm = 4;
  string nozzle_type = 5;
  optional uint32 snow = 6;
  optional uint32 hnow = 7;
}

message PrinterMaterialsSnapshot {
  string serial = 1;
  string printer_id = 2;
  string printer_materials_json = 3;
}

message CommandAck {
  string command_id = 1;
  bool accepted = 2;
  string error = 3;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string error = 3;
  string result_json = 4;
  optional FirmwareCommandResult firmware_result = 5;
}

message PrintJobReport {
  string serial = 1;
  string job_id = 2;
  string artifact_id = 3;
  string subtask_id = 4;
  string gcode_file = 5;
  string subtask_name = 6;
  string gcode_state = 7;
  uint32 percent = 8;
  bool has_percent = 9;
  uint32 remaining_time_minutes = 10;
  bool has_remaining_time_minutes = 11;
  uint32 current_layer = 12;
  bool has_current_layer = 13;
  uint32 total_layers = 14;
  bool has_total_layers = 15;
  repeated MachineDiagnostic diagnostics = 16;
  string observed_at = 17;
  string printer_materials_json = 18;
  repeated PrinterHmsItem hms = 19;
  bool has_hms = 20;
  uint32 print_error = 21;
  bool has_print_error = 22;
  string printer_job_id = 23;
  bool has_printer_job_id = 24;
  uint32 job_attr = 25;
  bool has_job_attr = 26;
}

message PrinterHmsItem {
  uint32 attr = 1;
  uint32 code = 2;
}

message MachineDiagnostic {
  string kind = 1;
  string severity = 2;
  string code = 3;
  string message = 4;
  string payload_json = 5;
}

message HubCommand {
  string command_id = 1;
  oneof command {
    RefreshPrinters refresh_printers = 10;
    PrintProjectFile print_project_file = 11;
    DiscoverPrinters discover_printers = 12;
    DiagnosePrinter diagnose_printer = 13;
    PrinterOperation printer_operation = 14;
    LinkPrinter link_printer = 15;
    RefreshPrinterMaterials refresh_printer_materials = 16;
    HubCameraCommand camera_stream = 17;
    RefreshFirmwareVersion refresh_firmware_version = 18;
    PrepareFirmwareControl prepare_firmware_control = 19;
    ExecuteFirmwareControl execute_firmware_control = 20;
    ReloadPrinterConnection reload_printer_connection = 21;
  }
}

message RefreshPrinters {}

message RefreshPrinterMaterials {
  string printer_id = 1;
  string serial_number = 2;
}

message ReloadPrinterConnection {
  string printer_id = 1;
  string serial_number = 2;
}

message LinkPrinter {
  string host = 1;
  reserved 2;
  reserved "serial_number";
  string access_code = 3;
  string name = 4;
  reserved 5;
  reserved "model";
  string printer_type = 6;
}

message DiscoverPrinters {
  uint32 timeout_seconds = 1;
}

message DiagnosePrinter {
  string serial_number = 1;
}

message PrinterOperation {
  string serial_number = 1;
  repeated DeviceFeature required_device_features = 2;
  oneof operation {
    PauseOperation pause = 10;
    ResumeOperation resume = 11;
    StopOperation stop = 12;
    SetPrintSpeedOperation set_print_speed = 13;
    HomeOperation home = 14;
    MoveAxesOperation move_axes = 15;
    SetHotendTemperatureOperation set_hotend_temperature = 16;
    AmsRereadRfidOperation ams_reread_rfid = 17;
    AmsLoadFilamentOperation ams_load_filament = 18;
    AmsUnloadFilamentOperation ams_unload_filament = 19;
    SelectExtruderOperation select_extruder = 20;
    SetBedTemperatureOperation set_bed_temperature = 21;
    SetChamberTemperatureOperation set_chamber_temperature = 22;
    ToggleLightOperation toggle_light = 23;
    SetChamberLightOperation set_chamber_light = 24;
    HandlePrintErrorOperation handle_print_error = 25;
    GcodeLineOperation gcode_line = 26;
    GetAutoNozzleMappingOperation get_auto_nozzle_mapping = 27;
    NozzleHolderCtrlOperation nozzle_holder_ctrl = 28;
    NozzleInfoConfirmOperation nozzle_info_confirm = 29;
    HolderNozzleRefreshOperation holder_nozzle_refresh = 30;
  }
}

// H2C nozzle-rack movement: 0 = centre (home), 1 = A top, 2 = B top.
message NozzleHolderCtrlOperation {
  uint32 action = 1;
}

// H2C rack nozzle info confirm: 16..21 for one rack slot, 255 for all.
message NozzleInfoConfirmOperation {
  uint32 id = 1;
}

// H2C rack nozzle re-read: 16..21 for one rack slot, 255 for all.
message HolderNozzleRefreshOperation {
  uint32 id = 1;
}

message GetAutoNozzleMappingOperation {
  string sequence_id = 1;
  optional uint32 version = 2;
  optional sint32 calibration = 3;
  optional sint32 extrude_cali_manual_mode = 4;
  repeated sint32 filament_seq = 5;
  repeated sint32 ams_mapping = 6;
  repeated AutoNozzleMappingFilamentInfo fila_info = 7;
  repeated AutoNozzleMappingNozzleInfo nozzle_info = 8;
  repeated AutoNozzleMappingGroupInfo group_info = 9;
}

message AutoNozzleMappingGroupInfo {
  sint32 id = 1;
  uint32 ext = 2;
  float dia = 3;
  string vol = 4;
}

message AutoNozzleMappingFilamentInfo {
  sint32 id = 1;
  uint32 direction = 2;
  sint32 group = 3;
  string nozzle_d = 4;
  string nozzle_v = 5;
  string cate = 6;
  string color = 7;
}

message AutoNozzleMappingNozzleInfo {
  sint32 pos = 1;
  string nozzle_d = 2;
  string nozzle_v = 3;
  float wear = 4;
  string cate = 5;
  string color = 6;
}

message GcodeLineOperation {
  string param = 1;
}

message AgentCameraEvent {
  string agent_id = 1;
  string tenant_id = 2;
  string event_id = 3;
  oneof event {
    AgentCameraHello hello = 10;
    AgentCameraChunk chunk = 11;
    AgentCameraClosed closed = 12;
  }
}

message AgentCameraHello {
  string credential = 1;
}

message AgentCameraChunk {
  string stream_id = 1;
  bytes data = 2;
}

message AgentCameraClosed {
  string stream_id = 1;
  bool success = 2;
  string error = 3;
}

message HubCameraCommand {
  string stream_id = 1;
  oneof command {
    OpenCameraStream open = 10;
    CloseCameraStream close = 11;
  }
}

message OpenCameraStream {
  string serial_number = 1;
  CameraStreamMode mode = 2;
}

message CloseCameraStream {}

enum CameraStreamMode {
  CAMERA_STREAM_MODE_UNSPECIFIED = 0;
  CAMERA_STREAM_MODE_MJPEG = 1;
  CAMERA_STREAM_MODE_FRAGMENTED_MP4 = 2;
}

message PauseOperation {}

message ResumeOperation {}

message StopOperation {}

enum PrintErrorAction {
  PRINT_ERROR_ACTION_UNSPECIFIED = 0;
  PRINT_ERROR_ACTION_RESUME = 1;
  PRINT_ERROR_ACTION_IGNORE = 2;
  PRINT_ERROR_ACTION_STOP = 3;
}

message HandlePrintErrorOperation {
  PrintErrorAction error_action = 1;
  uint32 print_error = 2;
  string printer_job_id = 3;
  uint64 sequence_id = 4;
}

message ToggleLightOperation {}

message SetChamberLightOperation {
  bool on = 1;
}

message SetPrintSpeedOperation {
  uint32 speed_mode = 1;
}

message SelectExtruderOperation {
  uint32 extruder_id = 1;
}

enum Axis {
  AXIS_UNSPECIFIED = 0;
  AXIS_X = 1;
  AXIS_Y = 2;
  AXIS_Z = 3;
}

message HomeOperation {
  repeated Axis axes = 1;
}

message AxisMovement {
  Axis axis = 1;
  double delta_mm = 2;
}

message MoveAxesOperation {
  repeated AxisMovement movements = 1;
  uint32 feedrate_mm_per_min = 2;
}

message SetHotendTemperatureOperation {
  uint32 temperature_celsius = 1;
  bool wait = 2;
  optional uint32 extruder_id = 3;
}

message SetBedTemperatureOperation {
  uint32 temperature_celsius = 1;
  bool wait = 2;
}

message SetChamberTemperatureOperation {
  uint32 temperature_celsius = 1;
  bool wait = 2;
}

message AmsRereadRfidOperation {
  uint32 ams_id = 1;
  uint32 slot_id = 2;
}

message AmsLoadFilamentOperation {
  uint32 ams_id = 1;
  uint32 slot_id = 2;
  uint32 global_tray_id = 3;
  string external_id = 4;
  optional uint32 extruder_id = 5;
}

message AmsUnloadFilamentOperation {
  uint32 ams_id = 1;
  uint32 slot_id = 2;
  uint32 global_tray_id = 3;
  string external_id = 4;
  optional uint32 extruder_id = 5;
}
