[workspace]
members = [
    "crates/pandar-agent",
    "crates/pandar-app",
    "crates/pandar-bambu-source",
    "crates/pandar-core",
    "crates/pandar-hub",
    "crates/pandar-network-plugin",
    "crates/pandar-protocol",
    "crates/pandar-studio-profile",
    "crates/pandar-studio-hook",
]
exclude = [
    "tools/release-smoke",
    "tools/scaled-artifact-smoke",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/ProjectPandar/pandar"

[workspace.dependencies]
anyhow = "1.0.100"
aes = "0.9.2"
aes-gcm = "0.11.0"
async-trait = "0.1.89"
aws-lc-rs = "1.17.0"
async-nats = "0.50.0"
aws-config = { version = "1.10.1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1.2.14"
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-types = "1.6.1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.23"
cap-std = "4.0.2"
clap = { version = "4.6.1", features = ["derive", "env"] }
cbc = "0.2.1"
futures-util = "0.3.32"
http-body = "1.0.1"
http-body-util = "0.1.3"
if-addrs = "0.15.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
md-5 = "0.11.0"
pandar-core = { path = "crates/pandar-core" }
pandar-protocol = { path = "crates/pandar-protocol" }
pandar-studio-profile = { path = "crates/pandar-studio-profile" }
pandar-studio-hook = { path = "crates/pandar-studio-hook" }
prost = "0.14"
protoc-bin-vendored = "3.2.0"
quick-xml = "0.41.0"
rcgen = "0.14.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.11.0"
rumqttc = { package = "rumqttc-v4-next", version = "=0.33.3" }
rust-embed = "8.11.0"
rustls = "=0.23.43"
sea-orm = { version = "2.0.0-rc.41", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "with-json", "with-time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros"] }
suppaftp = { version = "10.0.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
tempfile = "3.24.0"
thiserror = "2.0.17"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.2"
tracing = "0.1.43"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
x509-parser = "0.18.1"
zeroize = "1.8.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
